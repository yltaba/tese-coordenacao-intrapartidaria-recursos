  - claim_id: C3.2.01
    capitulo: 3
    secao: "### Universo empírico e recursos partidários"
    claim: "O universo reúne 7.630 candidaturas em 2018 e 9.675 em 2022."
    localizacao: {arquivo: tese/03-medindo-coordenacao-intrapartidaria.qmd, linha: 25}
    evidencia: {tipo: csv, referencia: "tese/reports/resultados-capitulo-3/01_universos.csv; runs/run-001/evidence/mea_01_output.txt; res_recompute_cap3.out"}
    assessment: {status: supported, confidence: alta}
    concerns:
      - "Em 21 (2018) e 26 (2022) candidaturas, CPF, gênero e histórico vêm de outra pessoa (keep-first na base; I-3-001/ADV-3-002). A contagem não muda."
    agent: "measurement-reviewer, results-reviewer"
    ids_origem: {measurement: C3.2.01, results: C3.2.01}
    issues: [I-3-001]
    runs: [run-001]
    versao_capitulo: 0aec63e5

  - claim_id: C3.2.02
    capitulo: 3
    secao: "### Universo empírico e recursos partidários"
    claim: "859 listas em 2018 e 711 em 2022; 73 e 63 sem recursos partidários; 3 e 0 eleitos nelas."
    localizacao: {arquivo: tese/03-medindo-coordenacao-intrapartidaria.qmd, linha: 27}
    evidencia: {tipo: csv, referencia: "01_universos.csv; evidence/mea_01_output.txt; res_recompute_cap3.out"}
    assessment: {status: supported, confidence: alta}
