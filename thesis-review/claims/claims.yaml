# Ledger consolidado de afirmações verificáveis da tese.
# Atualizado pelo chair ao fim de cada run. Um claim por item; status em rubric.yaml.
#
# Convenções do ledger (desde run-001):
# - IDs canônicos C{cap}.{secao}.{seq}: secao = ordem dos '##'/'###' COM conteúdo; cabeçalhos vazios não contam
#   (Cap. 3: 1 Dados · 2 Universo · 3 Seleção do núcleo · 4 Validação · 5 Resultados · 6 Amplitude · 7 Top-NECr ·
#   8 Robustez · 9 Discussão). Tabela de correspondência com os IDs dos agentes: runs/run-001/synthesis/conflicts.md §C8.
# - Mesclagem: mesmo claim_id → status mais conservador entre agentes (supported < partially_supported < unsupported <
#   contradicted) e união de concerns, salvo decisão arbitrada registrada em 'nota_status'.
# - 'agent' lista os agentes de origem; 'ids_origem' guarda o ID usado em cada relatório.
# - 'versao_capitulo' = prefixo do sha256 do .qmd avaliado.
# - Números marcados PROVISÓRIO dependem da regeneração da base (issue I-3-001).
version: 1
claims:

