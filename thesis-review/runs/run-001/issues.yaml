    claims: [C3.4.01, C3.6.01, C3.7.01, C3.7.02, C3.7.03, C3.8.01, C3.8.02, C3.8.03, C3.9.07]
    evidencia_decisiva: >-
      Três defeitos na mesma etapa (gerar_rrd.py), que se corrigem na mesma regeneração.
      D1 (MEA-3-001): _construir_resultados_select (l. 61-78) e _gerar_resultados_cpf (l. 506-524) fazem
      drop_duplicates(['ano_eleicao','sg_uf','nr_candidato'], keep='first'). Prefeitos, vereadores, vices e suplentes
      compartilham número dentro da UF, e isso produz n_eleicoes_prefeito = 46 (2022 MG AVANTE 7025). adv_01: 19 casos
      com 5 ou mais vitórias, todas de um único ano e de N municípios. adv_06: 79/189 vitórias de Governador e 177/269
      de Senador vão para outro CPF. O merge keep-first reproduz a flag em 7.630/7.630 e 9.675/9.675 candidaturas (adv_02).
      D2 (ADV-3-001): candidatos.parquet grava 28,6 % dos CPFs de 2012 e 26,4 % dos de 2014 com 8 a 10 dígitos
      (chair_01 a). O histórico é unido por CPF-string (l. 182, 805-808), e 31,8 % / 34,2 % das candidaturas da base
      têm CPF iniciado em '0' (chair_01 b). Para essas, só os registros de 2012 e 2014 se perdem; na prática, 473
      candidaturas de 2018 disputaram 2014 e 518 disputaram 2012 com CPF gravado sem zeros (chair_01 d). Verificação do
      chair: Marx Beltrão, Vitor Lippi, Aliel Machado e Newton Cardoso Jr. aparecem 'ELEITO POR QP' em 2014 com CPF de
      10 ou 9 dígitos e, em 2018, têm n_eleicoes_deputado_federal = 0 e competitivo = False (chair_01 c). Dos 378
      deputados federais eleitos em 2014 que concorreram em 2018, 52 têm n_eleicoes_deputado_federal = 0 e 25 são não
      competitivos, todos com CPF iniciado em 0. Numa ligação independente por (UF, cargo, nr), 29 (2018) e 6 (2022)
      candidaturas com vitória estadual/federal em 2014 são não competitivas (chair_02; adv: 30 / 6).
      D3 (ADV-3-002): construir_base (l. 88-91, 111-113) aplica o mesmo keep-first à própria candidatura. Há 61 / 76
      chaves de Dep. Federal com mais de 1 CPF (chair_01 e). Em 3 de 3 casos conferidos, o primeiro registro é de
      pessoa INAPTA e a candidatura APTA herda CPF, gênero e histórico dela: 2022 AM 4444 Pauderney Avelino (52.014
      votos) recebe o CPF e o gênero FEMININO de Raquel Fernandes; 2022 DF 4545 Andréia Zemuner fica MASCULINO; 2022 CE
      1251 José Arnon Bezerra herda o CPF de Pedro Augusto e é marcado competitivo.
      Efeito agregado (adv_02_metricas_variantes.csv; PROVISÓRIO): nas 13 variantes por ano, lift entre 1,76 e 1,91 e
      cobertura entre 75,4 % e 83,3 %, sempre fora da faixa de permutação (0,95-1,05).
