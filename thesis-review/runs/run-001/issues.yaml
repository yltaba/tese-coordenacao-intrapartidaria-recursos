      normalizada/não única na ligação por CPF), atingem a mesma variável e têm uma única correção.
    nota_chair: >-
      NÚMEROS 'CORRIGIDOS' SÃO PROVISÓRIOS. (1) Os números 'com CPF correto' de MEA-3-001/MEA-3-002 citados no pass 1
