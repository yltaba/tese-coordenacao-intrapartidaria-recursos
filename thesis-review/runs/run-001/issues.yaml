    titulo: "Ligação de CPF defeituosa na construção da base: chave (ano, UF, número) não única e CPFs de 2012/2014 sem zeros à esquerda corrompem o histórico eleitoral (flag competitiva) e, em ~0,3 % das candidaturas, a própria identidade da candidatura"
