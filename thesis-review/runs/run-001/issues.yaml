  - issue_id: I-3-002
    titulo: "Definição de 'competitivo' contraditória no texto (l. 64 × l. 68) e diferente da implementada; a regra do código aplica '10 % do QE' a disputas majoritárias (Prefeito, Governador, Senador), onde o limiar é quase trivial"
    capitulo: 3
    escala: macro
    dimensoes: [measurement, internal_validity]
    localizacao: {arquivo: tese/03-medindo-coordenacao-intrapartidaria.qmd, linha: 64, secao: "#### Desempenho eleitoral prévio {#sec-competitivos}"}
