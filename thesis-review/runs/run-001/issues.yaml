    evidencia_decisiva: >-
      l. 64: '10 % do quociente eleitoral nas disputas que concorreram, também exceto para vereador'; l. 68: '(ii) ...
      em disputa proporcional para Deputado Federal ou Deputado Estadual'. Código: gerar_rrd.py:686-692 aplica 10 % a
      Governador, Senador e Prefeito, com qt_vaga = 1 (l. 779); l. 137-145, sem Presidente e com Distrital; l. 178-179,
      vitórias até 2020 para 2022. adv_07: 72,7 % (2016) e 71,8 % (2020) das candidaturas a prefeito atingem o limiar,
      contra 14-20 % em Dep. Federal. Com a base atual, texto × código move pouco (lift 1,873 → 1,891; 1,890 → 1,908).
      Com D1+D2 de I-3-001 corrigidos, move muito: cobertura 80,7 / 80,7 % pela l. 68 contra 75,6 / 76,2 % pelo código;
      lift 1,90 / 1,85 contra 1,83 / 1,76 (adv_02, provisório).
    severidade_inicial: MAJOR
    contra_argumento:
      agent: adversarial-reviewer
      assessment: partially_valid
      resumo: >-
        Contradição e divergência reais. Propõe MODERATE: na base atual o efeito é de no máximo 0,02 no lift; a regra de
        10 % em majoritárias não é construto defensável, então a correção natural (código alinhado à l. 68) preserva os
        números; Presidente, janela e Distrital já estão em 19_notas_redacao.csv. Voltaria a MAJOR só se o autor
        mantivesse a regra do código.
    severidade_final: MAJOR
    confianca: alta
    razao: >-
      Não sigo o rebaixamento. Nenhuma das duas saídas é só textual. Alinhar à l. 68 exige mudar o código da medida
      (retirar os 10 % em majoritárias), e alinhar o texto ao código derruba '> 80 %' e '4/5' para 75,6 / 76,2 % assim
      que I-3-001 for corrigido (adv_02). O próprio adv_07 mostra que a regra implementada não mede credencial:
      3/4 dos candidatos a prefeito a atingem. O argumento 'na base atual move pouco' só vale enquanto a base estiver
      corrompida. Os itens Presidente, Distrital e janela, reconhecidos pelo autor, não pesam na severidade; o que pesa
      é o critério (ii).
    recomendacao: >-
      Fixar o construto na definição da l. 68 (recomendado): vitórias em Governador, Senador, Dep. Federal, Dep.
      Estadual/Distrital e Prefeito; 10 % do QE só em disputa proporcional. Retirar os 10 % de Governador/Senador/Prefeito
      em gerar_rrd.py:686-692; declarar a janela efetivamente usada; tirar 'Presidente' ou dizer que não há dados;
      reescrever a l. 64 para coincidir com a l. 68. Se o autor preferir manter a regra do código, reescrever as l. 64 e
      68 para ela e justificar os 10 % dos votos válidos em majoritária como credencial, sabendo que a cobertura cai para
      ~76 %. Decidir ANTES de regenerar a base (I-3-001).
    status: open

