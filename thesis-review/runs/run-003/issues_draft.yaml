  dimensao: [theory, internal_validity]
  problema_comum: "Nada em L171-218 diz por que o momento do repasse priorizaria alguém nem que padrão temporal se espera. A L214 promete 'priorização temporal ao núcleo priorizado', mas o Cap. 4 usa competitivo/não competitivo (e o núcleo seria circular, [3.D]). Cap. 4 L49 atribui a Fiva et al. uma previsão sobre o FEFC que o Cap. 2 não sustenta. A rival da prontidão administrativa (Cap. 4 L9) não aparece."
  severidade_inicial: MAJOR
  contra_argumento: {agent: adversarial-reviewer, assessment: not_reviewed, resumo: ""}
  severidade_final: MAJOR
  confianca: alta
  razao: ""
  recomendacao: "Reescrever (iii) para o que o Cap. 4 testa ('antecipação dos repasses a candidaturas com credenciais prévias'). Derivar uma expectativa temporal mínima (dinheiro cedo = tempo de campanha, contratação; conciliar com o risco moral de Fiva et al.), possivelmente em L77. Nomear a prontidão administrativa como rival. Rever a atribuição a Fiva et al. no Cap. 4 L49."
  status: open
  depende_de: [I-2-004]

