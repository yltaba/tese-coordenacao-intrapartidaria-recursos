- issue_id: I-2-001
  titulo: "A expectativa central não discrimina o mecanismo de sinalização das rivais que o próprio Argumento nomeia"
  capitulo: 2
  findings: [THE-2-001, MET-2-001, LIT-2-009]
  claims: [C2.7.03, C2.7.09, C2.7.10]
  dimensao: [theory, internal_validity, literature]
  problema_comum: "A implicação de L204 (sobrerrepresentação de credenciados) também é prevista por captura, barganha e ameaça de saída (L178), e ainda por 'força do candidato' e inércia. O texto não diz que observação as separa e não ancora as rivais na literatura."
  severidade_inicial: MAJOR
  contra_argumento: {agent: adversarial-reviewer, assessment: not_reviewed, resumo: ""}
  severidade_final: MAJOR
  confianca: alta
  razao: ""
  recomendacao: "Após L178, dar a cada rival uma implicação que difira da sinalização. Ex.: a captura por mandatários não prevê prêmio a quem teve votação expressiva e perdeu; a sinalização prevê. Esse teste já existe (qe_sem_vitoria, Cap. 3 L157: 2,89/1,70). Declarar quais rivais o desenho não separa (barganha, ameaça de saída, força do candidato: correlação intralista partidário×privado de +0,41/+0,34) e ancorar cada rival em uma referência. Alternativa: reformular L204 como padrão compatível, sem o 'porque' como tese demonstrada."
  status: open
  depende_de: [I-2-002]

- issue_id: I-2-002
  titulo: "O elo incentivo → concentração em credenciados não é derivado (dispersão e marginais não são descartados) nem ancorado na literatura de alocação partidária"
  capitulo: 2
  findings: [THE-2-002, MET-2-002, LIT-2-002]
  claims: [C2.6.07, C2.7.01, C2.7.10]
  dimensao: [theory, literature, internal_validity]
  problema_comum: "As regras descritas (35% FEFC e 95% FP por votos; pooling) são compatíveis com dispersão ou foco em marginais. O Argumento não diz por que prevalece a concentração em credenciados, não cita a literatura que discute exatamente essa escolha e não prevê a direção 2018→2022. O Cap. 4 (L25) deriva a direção oposta."
  severidade_inicial: MAJOR
  contra_argumento: {agent: adversarial-reviewer, assessment: not_reviewed, resumo: ""}
  severidade_final: MAJOR
  confianca: alta
  razao: ""
  recomendacao: "Escrever no Argumento o elo que falta (sob incerteza, a credencial é o único sinal ex-ante do retorno do recurso; o puxador eleva o quociente), situá-lo frente à expectativa de priorizar marginais (literatura de alocação partidária; PVEA de Shugart, Valdini & Suominen) e derivar dele a direção esperada para 2022, alinhando o Cap. 4 L25. Ou declarar que a tese não distingue essas lógicas."
  status: open
  depende_de: []

