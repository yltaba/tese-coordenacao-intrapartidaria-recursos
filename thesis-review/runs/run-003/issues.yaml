  severidade_final: MODERATE
  confianca: alta
  razao: "Os dois especialistas concordam que falta a expectativa. A 'inversão' de MET-2-004 depende da normalização: pela do repositório, (H−E)/(Hmax−E), o gradiente se atenua, mas não se inverte (0,70/0,79/0,76 e 0,60/0,73/0,74; conflicts.md C2). Achado do chair: Cheibub & Sin, que o Cap. 2 usa como referência de coordenação, encontram coordenação mais difícil em distritos grandes, e a priorização financeira do Cap. 3 é mais forte neles. O capítulo precisa dizer como as duas coisas se relacionam."
