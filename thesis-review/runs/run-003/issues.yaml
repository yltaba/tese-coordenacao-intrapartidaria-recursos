- issue_id: I-2-002
  titulo: "O Argumento não diz que o foco em marginais e a concentração em credenciados são indistinguíveis em E1, nem que não prevê direção para 2018→2022; a literatura de alocação partidária está ausente"
  capitulo: 2
  findings: [THE-2-002, MET-2-002, LIT-2-002]
  claims: [C2.6.07, C2.7.01, C2.7.10]
  dimensao: [theory, literature]
  severidade_inicial: MAJOR
  contra_argumento:
    agent: adversarial-reviewer
    assessment: partially_valid
    resumo: "O elo incerteza → sinal está na própria L204. A dispersão é rejeitada pelos dados: NECr/C mediano de 0,466/0,519, só 8,2%/11,7% das listas com NECr/C ≥ 0,9, lift 1,89/1,86. O foco em marginais também produz lift > 1 para credenciados. O Cap. 4 L25 fala do grau de concentração, não da composição do topo, então não há 'direção oposta'. Resta um problema de redação e de bibliografia."
  severidade_final: MODERATE
  confianca: alta
  razao: "Sigo o adversarial. Conferi que a L204 contém 'Quando os recursos são distribuídos, a votação ainda é incerta. Vitórias anteriores e votações expressivas oferecem sinais observáveis' e que evidence/adv_rivais_cap2.out (bloco B) reproduz o NECr/C. A interpretação não precisa mudar. Falta dizer o que E1 não distingue. A lacuna bibliográfica tem solução à mão: Janusz et al. (janusz.txt L180-190) citam a literatura de alocação a 'vulnerable incumbents and qualified challengers' (Damore & Hansford 1999; Herrnson 2009)."
  recomendacao: "No Argumento: (a) uma frase dizendo que a divisão igualitária é rejeitada pelo próprio desenho (lift = 1 e NECr/C = 1 por construção sob igualdade); (b) uma frase dizendo que o foco em marginais e a concentração em credenciados só divergem dentro do grupo credenciado, o que a tese não testa (e, em 2018, o quartil mais votado dos ex-eleitos recebe menos que o Q3); (c) declarar que a tese não prevê direção para 2018→2022 e mover a previsão do Cap. 4 L25 para I-2-009; (d) citar a literatura de alocação partidária (Jacobson; Damore & Hansford; Herrnson, via Janusz et al.) e, se útil, PVEA (Shugart, Valdini & Suominen)."
  status: open
  depende_de: [I-2-005]

- issue_id: I-2-004
  titulo: "'Coordenação intrapartidária' não é definida no Cap. 2, muda de sentido e é afirmada como fato ('constitui')"
  capitulo: 2
  findings: [THE-2-004, MET-2-005]
  claims: [C2.7.02, C2.4.07]
  dimensao: [theory, internal_validity]
  severidade_inicial: MAJOR
  contra_argumento:
    agent: adversarial-reviewer
    assessment: partially_valid
    resumo: "Há uma definição comportamental de coordenação ancorada em obras já citadas (Cheibub & Sin, L63; Cox 1997), e o autor a adotou na nota de 11/09 ('não é concentração, mas priorização de um conjunto competitivo'). Sob essa definição, a medida corresponde ao conceito. A parte 'objetivos coletivos' duplica o I-2-001."
  severidade_final: MODERATE
  confianca: alta
  razao: "A condição do pass 1 (conflicts.md C1) se cumpre, e conferi as fontes independentemente da Introdução/Considerações. notes/daily/2026-09-11.md:5 traz a definição do autor, e Cheibub & Sin usam 'coordinated' no sentido estrutural de Cox (1997) (cheibub.txt L71-72, L712). O defeito que resta é de definição e redação: 'coordenação' não é definida no capítulo, muda de sentido (L55, L63, L176) e a L176 diz 'constitui'. A motivação coletiva já está contada no I-2-001."
  recomendacao: "Definir coordenação uma vez, no sentido comportamental (priorização sistemática de recursos escassos a um conjunto de candidaturas identificadas como viáveis, à Cox 1997 e Cheibub & Sin 2020), e declarar que a tese não mede o efeito dessa coordenação sobre o resultado da legenda. Na L176, trocar 'constitui um instrumento de coordenação' por 'pode operar como'. Harmonizar os usos das L55, L63 e L176."
  status: open
  depende_de: []

