- issue_id: I-2-001
  titulo: "A expectativa central não discrimina o mecanismo de sinalização das rivais que o próprio Argumento nomeia"
  capitulo: 2
  findings: [THE-2-001, MET-2-001, LIT-2-009]
  claims: [C2.7.03, C2.7.09, C2.7.10]
  dimensao: [theory, internal_validity, literature]
  severidade_inicial: MAJOR
  contra_argumento:
    agent: adversarial-reviewer
    assessment: valid
    resumo: "A L204 afirma o 'porque' como tese, e a implicação testada (sobrerrepresentação em relação ao acaso) também decorre de captura, barganha, ameaça de saída (L178) e força do candidato. A recomputação do adversarial reforça a crítica: entre ex-eleitos para DF a parcela não cresce com a votação anterior (Spearman −0,13/0,06), o que é compatível com captura por posição. Há um teste discriminante que já existe e o Cap. 2 não anuncia: fora dos mandatários, a parcela cresce com a votação prévia (Spearman 0,43/0,47; qe_sem_vitoria 2,89/1,70)."
  severidade_final: MAJOR
  confianca: alta
  razao: "Mantido MAJOR, como sugerido pelo adversarial. O trecho da L204 ('priorizam … porque estas constituem sinais') enuncia um mecanismo que o desenho não separa das rivais da L178, e evidence/adv_rivais_cap2.out (bloco C2) mostra que, entre mandatários, o padrão observado é o que a captura prevê. O atenuante da Introdução (L36) não entra na decisão, porque a autoria e o estatuto desse texto estão em aberto (I-2-024)."
  recomendacao: "Reformular a L204 como padrão compatível com a sinalização, sem o 'porque' como tese demonstrada. Depois da L178, dar a cada rival sua implicação diferencial e dizer qual o desenho separa e qual não separa: (a) a captura por mandatários não prevê prêmio a quem teve votação expressiva sem vitória, nem o gradiente da parcela com a votação prévia fora dos mandatários (Cap. 3 L157: 2,89/1,70; Spearman 0,43/0,47), e a sinalização prevê; (b) barganha, ameaça de saída e força do candidato não são separadas (correlação intralista partidário × não partidário de +0,41/+0,34, parcial de 0,32/0,25 com as credenciais controladas); (c) entre mandatários, o perfil plano é compatível com a captura. Ancorar as rivais em literatura: Janusz et al. (2021, p. 2-3 do PDF) já listam a rival 'razões de política' (Norris & Lovenduski)."
  status: open
  depende_de: []

- issue_id: I-2-005
  titulo: "A contribuição não é delimitada frente a precedentes que testaram a mesma hipótese (Janusz et al., 2014) e já construíram um número efetivo de financiados (Bolognesi et al., 2014)"
  capitulo: 2
  findings: [THE-2-005, LIT-2-001, LIT-2-016, CHAIR]
  claims: [C2.3.08, C2.4.08, C2.6.06, C2.7.07, C2.7.10, C2.7.12]
  dimensao: [theory, literature]
  severidade_inicial: MAJOR
  contra_argumento:
    agent: adversarial-reviewer
    assessment: partially_valid
    resumo: "Sugeriu MODERATE: a diferença frente a Cheibub & Sin são três eixos compatíveis (só o 'novamente' do Cap. 4 L13 é defeito), Bolognesi seria 2014 e já coberto pelo critério institucional da L153, e o capítulo não reivindica novidade falsa sobre Janusz. Deixou uma condição explícita para voltar a MAJOR: se Janusz et al. fizerem comparação intralista com classificação ex-ante no período do FEFC."
  severidade_final: MAJOR
  confianca: alta
  razao: "Não sigo o adversarial. Os textos-fonte que estão no repositório decidem a questão, e nenhum agente os leu. Janusz et al. testam em 2014, com efeitos fixos de partido estadual (= lista), exatamente a hipótese 'party elites provide experienced politicians greater campaign resources', e a justificam como a L204 (incerteza sobre as chances, experiência como sinal de potencial eleitoral, maximizar cadeiras; janusz.txt L180-213, L418-445). Bolognesi et al. constroem um 'número efetivo de financiados' para os deputados federais de 2014 (bolognesi.txt L1434-1509). A condição do adversarial se cumpre em duas das três partes: intralista e ex-ante, sim; FEFC, não. Com isso, a L204 ('O argumento desta tese é…') apresenta como próprio um argumento já formulado e testado, e isso exige reenquadrar a contribuição, não só acrescentar uma citação."
  evidencia_chair:
    - fonte: "revisoes/fontes-discussao-capitulo3/janusz.txt:180-213"
      detalhe: "'an individual candidate's chances of electoral success … is never known with certainty … Information on candidate background and electoral experience is likely to have an outsized impact on elite perceptions of electoral potential … (Cheibub and Sin, 2020) … Hypothesis 1: Party elites provide experienced politicians greater campaign resources than inexperienced candidates.'"
    - fonte: "revisoes/fontes-discussao-capitulo3/janusz.txt:418-419, 440-462, 528-540"
      detalhe: "Dados das eleições de 2014 para a Câmara (5.864 candidaturas). VD = recursos do partido estadual (R$ 10 mil). 'we employ state party fixed effects'. Variáveis: incumbente, ocupou cargo nos últimos 10 anos, candidatura anterior sem eleição. Resultado: incumbentes recebem ≈ R$ 236.660 a mais, ex-ocupantes ≈ R$ 25.000 a mais. 2018 aparece só de passagem (L790: 'R$2,900 less')."
    - fonte: "revisoes/fontes-discussao-capitulo3/bolognesi.txt:1-30, 1434-1509"
      detalhe: "'Como os partidos distribuem o dinheiro… em 2014'. Hipótese: recursos de origem partidária privilegiam candidatos com mandato. 'Operacionalizamos um indicador de número efetivo de financiados (NEF)'; correlação NEF × bancada eleita r = 0,924. O próprio mapa-evidencias.md (L9) do autor já registra: 'Não atribuir à tese a invenção do número efetivo em recursos'. grep: bolognesietal2020 não é citado em nenhum tese/*.qmd."
  recomendacao: "Reescrever o fecho do Argumento como delimitação explícita: (1) a hipótese de priorização da experiência e sua justificativa informacional são de Janusz et al. (2021) e da literatura norte-americana que eles citam (Jacobson; Damore & Hansford; Herrnson); a tese a reexamina sob outro regime (pós-ADI 4650, FEFC, 2018 e 2022). (2) O que a tese acrescenta: a composição de um núcleo de tamanho endógeno por lista (Top-NECr) em vez do nível em R$ ou da correlação agregada NEF × bancada de Bolognesi et al.; parcelas intralista desagregadas por cargo e o teste da votação sem vitória; o timing dos repasses. (3) Citar Bolognesi et al. (2020) como antecedente do número efetivo em recursos. (4) Na L151, dizer que Janusz et al. analisam 2014 e recursos do partido estadual. (5) Manter uma única formulação da diferença frente a Cheibub & Sin e corrigir o 'novamente' do Cap. 4 L13. A parte de medida (NEF × NECr) também vai para o próximo run do Cap. 3."
  status: open
  depende_de: []

- issue_id: I-2-003
  titulo: "A frente (iii), timing, não tem expectativa derivada no Cap. 2, e a rival da prontidão administrativa não aparece"
  capitulo: 2
  findings: [THE-2-003, MET-2-003]
  claims: [C2.7.06, C2.7.08]
  dimensao: [theory, internal_validity]
  severidade_inicial: MAJOR
  contra_argumento:
    agent: adversarial-reviewer
    assessment: partially_valid
    resumo: "Caem duas partes: a troca núcleo → credencial é uma correção de uma palavra, já justificada em outros lugares (circularidade), e a leitura 'Fiva prevê o contrário' não tem apoio na L91. Fica o núcleo: não há expectativa temporal no Cap. 2, e a prontidão administrativa é uma rival que a base não permite testar (não há data de habilitação de conta/CNPJ em rrd_df_novo.parquet). Enquanto isso, o Cap. 4 L47 conclui intenção."
  severidade_final: MAJOR
  confianca: alta
  razao: "Sigo o adversarial. O Cap. 2 não diz por que o momento do repasse seria um instrumento de priorização, e o Cap. 4 L47 ('partidos políticos consideram a vantagem que distribuir dinheiro antecipadamente constitui') tira disso uma conclusão de intenção que uma rival não testável também explica. Isso limita a interpretação de um capítulo inteiro. A justificativa substantiva já existe no Cap. 4 L29, então o custo no Cap. 2 é baixo."
  recomendacao: "No Cap. 2: (a) derivar uma expectativa temporal mínima (dinheiro recebido cedo = mais tempo de campanha; ver Cap. 4 L29) e ligá-la à L77 ('e quando os recebem'); (b) reescrever a frente (iii) para o que o Cap. 4 testa ('antecipação dos repasses a candidaturas com credenciais prévias'), com a justificativa da circularidade; (c) nomear a prontidão administrativa como rival e dizer que a base atual não permite separá-la. Não usar Fiva et al. para prever o sentido do timing. No Cap. 4: trocar a L47 por uma formulação compatível e rever a atribuição a Fiva et al. na L49."
  status: open
  depende_de: []

